<div class="base-checkbox-wrapper" 
     [class.ks-checked]="checked" 
     [class.ks-disabled]="disabled"
     (click)="toggle()">
  
  <div class="base-checkbox-box">
    @if (checked) {
      <span class="material-symbols-outlined ks-check-icon">check</span>
    }
  </div>

  @if (label) {
    <span class="base-checkbox-label">{{ label }}</span>
  } @else {
    <span class="base-checkbox-label">
      <ng-content></ng-content>
    </span>
  }

</div>
