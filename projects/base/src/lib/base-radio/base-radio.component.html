<div class="base-radio-wrapper" 
     [class.ks-checked]="checked" 
     [class.ks-disabled]="disabled"
     (click)="select()">
  
  <div class="base-radio-circle">
    @if (checked) {
      <div class="base-radio-dot"></div>
    }
  </div>

  @if (label) {
    <span class="base-radio-label">{{ label }}</span>
  } @else {
    <span class="base-radio-label">
      <ng-content></ng-content>
    </span>
  }

</div>
