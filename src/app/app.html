<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 glass-plate px-md py-sm rounded-full flex gap-sm border-white/10 shadow-[0_15px_35px_rgba(0,0,0,0.8)] backdrop-blur-xl items-center max-w-[95%] overflow-x-auto no-scrollbar">
  <div class="font-label-sm text-primary uppercase mr-2 tracking-wider text-[11px] font-bold select-none whitespace-nowrap">{{ lang.t('SWITCHER_LABEL') }}</div>
  
  <a routerLink="/draft/landing-b" routerLinkActive="bg-white/10 text-primary border-primary/40" class="px-md py-xs rounded-full text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all text-xs font-label-md border border-transparent whitespace-nowrap">
    {{ lang.t('NAV_LANDING_B') }}
  </a>
  
  <a routerLink="/draft/landing-a" routerLinkActive="bg-white/10 text-primary border-primary/40" class="px-md py-xs rounded-full text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all text-xs font-label-md border border-transparent whitespace-nowrap">
    {{ lang.t('NAV_LANDING_A') }}
  </a>
  
  <a routerLink="/draft/sphere" routerLinkActive="bg-white/10 text-primary border-primary/40" class="px-md py-xs rounded-full text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all text-xs font-label-md border border-transparent whitespace-nowrap">
    {{ lang.t('NAV_SPHERE') }}
  </a>
  
  <a routerLink="/draft/design-system" routerLinkActive="bg-white/10 text-primary border-primary/40" class="px-md py-xs rounded-full text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all text-xs font-label-md border border-transparent whitespace-nowrap">
    {{ lang.t('NAV_SYSTEM') }}
  </a>

  <a routerLink="/draft/console" routerLinkActive="bg-white/10 text-primary border-primary/40" class="px-md py-xs rounded-full text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all text-xs font-label-md border border-transparent whitespace-nowrap">
    {{ lang.t('NAV_CONSOLE') }}
  </a>

  <!-- Divider -->
  <div class="h-6 w-[1px] bg-white/10 mx-xs"></div>

  <!-- Language Switcher Dropdown Container -->
  <div class="relative flex items-center">
    <button (click)="toggleLangDropdown()" 
            class="px-md py-xs rounded-full text-xs font-bold text-primary hover:bg-white/5 border border-primary/20 hover:border-primary/40 transition-all flex items-center gap-xs whitespace-nowrap">
      <span class="material-symbols-outlined text-[14px]">language</span>
      <span>{{ lang.currentLang().toUpperCase() }}</span>
      <span class="material-symbols-outlined text-[12px] transition-transform duration-200"
            [ngClass]="{'rotate-180': isLangDropdownOpen}">keyboard_arrow_up</span>
    </button>

    <!-- Language Dropdown Menu (Opens Upwards) -->
    <div *ngIf="isLangDropdownOpen" 
         class="absolute bottom-12 right-0 bg-[#0c0c0c]/95 border border-white/10 backdrop-blur-2xl rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.9)] py-xs flex flex-col min-w-[120px] overflow-hidden z-50">
      <button (click)="selectLanguage('en')" 
              [ngClass]="{'bg-white/10 text-primary font-bold': lang.currentLang() === 'en'}"
              class="px-md py-sm text-left text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center gap-sm">
        <span>English</span>
      </button>
      <button (click)="selectLanguage('vi')" 
              [ngClass]="{'bg-white/10 text-primary font-bold': lang.currentLang() === 'vi'}"
              class="px-md py-sm text-left text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center gap-sm">
        <span>Tiếng Việt</span>
      </button>
      <button (click)="selectLanguage('ko')" 
              [ngClass]="{'bg-white/10 text-primary font-bold': lang.currentLang() === 'ko'}"
              class="px-md py-sm text-left text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center gap-sm">
        <span>한국어</span>
      </button>
    </div>
  </div>
</div>

<router-outlet />
