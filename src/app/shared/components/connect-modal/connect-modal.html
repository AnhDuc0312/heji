<div *ngIf="connect.isModalOpen()" 
     class="fixed inset-0 z-100 flex items-center justify-center p-md overflow-hidden">
  
  <!-- Backdrop Blur Overlay -->
  <div (click)="close()" 
       class="absolute inset-0 bg-black/70 backdrop-blur-md transition-opacity duration-300"></div>

  <!-- Modal Container -->
  <div class="relative w-full max-w-[480px] bg-[#0b0b0d]/90 border border-white/10 backdrop-blur-2xl rounded-2xl shadow-[0_25px_60px_rgba(0,0,0,0.95)] overflow-hidden z-10 flex flex-col max-h-[90vh] animate-scale-up">
    
    <!-- Top Glow Line -->
    <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-primary via-tertiary to-secondary"></div>

    <!-- Header -->
    <div class="flex justify-between items-center px-xl py-lg border-b border-white/5">
      <div class="flex flex-col">
        <h3 class="font-headline-md text-headline-sm font-bold text-on-surface flex items-center gap-xs">
          <span class="material-symbols-outlined text-primary text-[20px]">sensors</span>
          <span>{{ lang.t('MODAL_CONNECT_TITLE') }}</span>
        </h3>
        <span class="text-[11px] text-on-surface-variant uppercase tracking-wider mt-xs">Secure Cryptographic Link</span>
      </div>
      <button (click)="close()" 
              class="w-8 h-8 rounded-full border border-white/5 bg-white/5 flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-white/10 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="p-xl flex flex-col gap-lg overflow-y-auto no-scrollbar">
      
      <!-- Wallet Selection Stage -->
      <div *ngIf="!connect.isConnecting()" class="flex flex-col gap-md">
        <p class="text-xs text-on-surface-variant leading-relaxed">
          {{ lang.t('MODAL_CONNECT_DESC') }}
        </p>

        <div class="grid grid-cols-1 gap-sm mt-xs">
          <!-- Real MetaMask -->
          <button (click)="selectWallet('MetaMask')"
                  class="group flex items-center justify-between p-lg rounded-xl bg-white/5 border border-white/5 hover:border-primary/30 hover:bg-white/10 transition-all duration-300 text-left focus:outline-none cursor-pointer">
            <div class="flex items-center gap-md">
              <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#f6851b] to-[#e2761b] flex items-center justify-center text-on-primary shadow-lg transition-transform duration-300 group-hover:scale-110">
                <span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
              </div>
              <div>
                <h4 class="font-bold text-sm text-on-surface group-hover:text-primary transition-colors">MetaMask (EVM)</h4>
                <span class="text-[10px] uppercase tracking-wider font-bold"
                      [ngClass]="connect.isMetaMaskAvailable() ? 'text-green-400' : 'text-on-surface-variant'">
                  {{ connect.isMetaMaskAvailable() ? 'Detected / Installed' : 'Not Installed (Simulate)' }}
                </span>
              </div>
            </div>
            <span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
          </button>

          <!-- Real Phantom -->
          <button (click)="selectWallet('Phantom')"
                  class="group flex items-center justify-between p-lg rounded-xl bg-white/5 border border-white/5 hover:border-primary/30 hover:bg-white/10 transition-all duration-300 text-left focus:outline-none cursor-pointer">
            <div class="flex items-center gap-md">
              <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#ab9ff2] to-[#7f6ff0] flex items-center justify-center text-on-primary shadow-lg transition-transform duration-300 group-hover:scale-110">
                <span class="material-symbols-outlined text-[20px]">insights</span>
              </div>
              <div>
                <h4 class="font-bold text-sm text-on-surface group-hover:text-primary transition-colors">Phantom (Solana)</h4>
                <span class="text-[10px] uppercase tracking-wider font-bold"
                      [ngClass]="connect.isPhantomAvailable() ? 'text-green-400' : 'text-on-surface-variant'">
                  {{ connect.isPhantomAvailable() ? 'Detected / Installed' : 'Not Installed (Simulate)' }}
                </span>
              </div>
            </div>
            <span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
          </button>

          <!-- Sandbox Testing Divider -->
          <div class="flex items-center gap-sm my-xs">
            <div class="h-[1px] flex-grow bg-white/5"></div>
            <span class="text-[9px] text-on-surface-variant uppercase tracking-wider font-bold">Sandbox Testing</span>
            <div class="h-[1px] flex-grow bg-white/5"></div>
          </div>

          <!-- Simulation Button -->
          <button (click)="selectWallet('Demo Sandbox', true)"
                  class="group flex items-center justify-between p-lg rounded-xl bg-white/2 border border-dashed border-white/10 hover:border-primary/30 hover:bg-white/5 transition-all duration-300 text-left focus:outline-none cursor-pointer">
            <div class="flex items-center gap-md">
              <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#00dbe9] to-[#b0c6ff] flex items-center justify-center text-on-primary shadow-lg transition-transform duration-300 group-hover:scale-110">
                <span class="material-symbols-outlined text-[20px]">terminal</span>
              </div>
              <div>
                <h4 class="font-bold text-sm text-on-surface group-hover:text-primary transition-colors">Simulate Wallet Link</h4>
                <span class="text-[10px] text-on-surface-variant uppercase tracking-wider">Fast Demo Bypass</span>
              </div>
            </div>
            <span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
          </button>
        </div>
      </div>

      <!-- Connecting Stage -->
      <div *ngIf="connect.isConnecting()" class="flex flex-col gap-lg py-md">
        
        <!-- Connection Progress Dials -->
        <div class="flex flex-col items-center justify-center gap-md">
          <div class="relative w-28 h-28 flex items-center justify-center">
            
            <!-- Outer Pulsing Ring -->
            <div class="absolute inset-0 rounded-full border border-primary/20 animate-ping opacity-75"></div>
            
            <!-- SVG Circle Gauge -->
            <svg class="w-full h-full transform -rotate-90">
              <circle cx="56" cy="56" r="48" stroke="rgba(255,255,255,0.05)" stroke-width="4" fill="transparent"/>
              <circle cx="56" cy="56" r="48" stroke="url(#modalGlowGrad)" stroke-width="4" fill="transparent"
                      [attr.stroke-dasharray]="301.6"
                      [attr.stroke-dashoffset]="301.6 - (301.6 * connect.connectionProgress()) / 100"
                      class="transition-all duration-300"/>
              
              <defs>
                <linearGradient id="modalGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#b0c6ff"/>
                  <stop offset="100%" stop-color="#00dbe9"/>
                </linearGradient>
              </defs>
            </svg>

            <!-- Center Info -->
            <div class="absolute flex flex-col items-center justify-center">
              <span class="font-display-md text-xl font-bold text-on-surface">{{ connect.connectionProgress() }}%</span>
              <span class="text-[9px] text-on-surface-variant uppercase tracking-wider font-semibold">LINKING</span>
            </div>
          </div>

          <span class="text-xs text-primary font-bold tracking-wider animate-pulse">ESTABLISHING QUANTUM LINK...</span>
        </div>

        <!-- CLI Console Log Output -->
        <div class="flex flex-col gap-xs">
          <span class="text-[10px] text-on-surface-variant uppercase tracking-wider font-bold">Diagnostics Log:</span>
          <div class="h-[120px] rounded-lg bg-black/60 border border-white/5 p-md font-mono text-[11px] text-primary overflow-y-auto flex flex-col gap-xs no-scrollbar shadow-inner">
            <div *ngFor="let log of connect.logs()" class="animate-fade-in text-cyan-400">
              {{ log }}
            </div>
            <div *ngIf="connect.connectionProgress() < 100" class="flex gap-xs items-center text-primary mt-xs">
              <span class="w-[6px] h-3 bg-primary animate-pulse"></span>
              <span>Running socket handshake...</span>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- Footer Security Information -->
    <div class="px-xl py-md bg-black/40 border-t border-white/5 flex items-center justify-center gap-xs">
      <span class="material-symbols-outlined text-green-400 text-[14px]">verified_user</span>
      <span class="text-[9px] text-on-surface-variant uppercase tracking-widest font-semibold">AES-256 Quantum Shield Active</span>
    </div>
  </div>
</div>
