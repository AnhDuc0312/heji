<!-- Top Navigation -->
<nav class="fixed top-0 w-full z-45 bg-[#0a0a0c]/70 backdrop-blur-xl border-b border-white/5 shadow-[0_4px_30px_rgba(0,0,0,0.8)]">
  <div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto h-[72px]">
    
    <!-- Logo -->
    <div routerLink="/draft/landing-b" class="font-headline-md text-headline-md font-extrabold text-on-surface tracking-tighter cursor-pointer hover:opacity-80 transition-all select-none">
      NEURAL<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">IS</span>
    </div>

    <!-- Desktop Nav Links -->
    <div class="hidden lg:flex items-center gap-lg h-full">
      <div *ngFor="let cat of categories()" class="relative group h-full flex items-center">
        <!-- Category Title -->
        <button class="text-on-surface-variant hover:text-on-surface group-hover:text-primary transition-colors font-body-md text-body-md tracking-wider flex items-center gap-xs cursor-pointer py-md h-full focus:outline-none">
          <span>{{ lang.t(cat.labelKey) }}</span>
          <span class="material-symbols-outlined text-[14px] transition-transform duration-300 group-hover:rotate-180">keyboard_arrow_down</span>
        </button>

        <!-- Dropdown Menu -->
        <div class="absolute top-full left-1/2 -translate-x-1/2 bg-[#0c0c0e]/95 border border-white/5 backdrop-blur-2xl rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.95)] py-md px-md min-w-[240px] opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-300 transform translate-y-2 group-hover:translate-y-0 z-50 flex flex-col gap-xs">
          <!-- Bridge the hover gap -->
          <div class="absolute -top-4 inset-x-0 h-4 bg-transparent"></div>
          <div class="absolute -top-[1px] left-1/2 -translate-x-1/2 w-16 h-[1px] bg-gradient-to-r from-primary to-secondary"></div>
          
          <a *ngFor="let link of cat.links" 
             [routerLink]="link.route" 
             routerLinkActive="text-primary bg-white/5 font-bold" 
             [routerLinkActiveOptions]="{exact: true}"
             class="px-md py-sm rounded-lg text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center justify-between group/link">
            <span>{{ lang.t(link.labelKey) }}</span>
            <span class="material-symbols-outlined text-[12px] opacity-0 group-hover/link:opacity-100 group-hover/link:translate-x-1 transition-all">arrow_forward</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Right Side Actions -->
    <div class="hidden lg:flex items-center gap-md">
      <!-- Language Dropdown -->
      <div class="relative flex items-center">
        <button (click)="toggleLangDropdown()" 
                class="px-md py-sm rounded-full text-xs font-bold text-on-surface-variant hover:text-on-surface hover:bg-white/5 border border-white/10 transition-all flex items-center gap-xs cursor-pointer focus:outline-none">
          <span class="material-symbols-outlined text-[16px]">language</span>
          <span>{{ lang.currentLang().toUpperCase() }}</span>
          <span class="material-symbols-outlined text-[14px] transition-transform duration-200"
                [ngClass]="{'rotate-180': isLangDropdownOpen}">keyboard_arrow_down</span>
        </button>

        <!-- Dropdown Menu (Opens Downwards) -->
        <div *ngIf="isLangDropdownOpen" 
             class="absolute top-12 right-0 bg-[#0c0c0e]/95 border border-white/5 backdrop-blur-2xl rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.95)] py-xs flex flex-col min-w-[120px] overflow-hidden z-50">
          <button (click)="selectLanguage('en')" 
                  [ngClass]="{'bg-white/10 text-primary font-bold': lang.currentLang() === 'en'}"
                  class="px-md py-sm text-left text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center gap-sm cursor-pointer focus:outline-none w-full">
            <span>English</span>
          </button>
          <button (click)="selectLanguage('vi')" 
                  [ngClass]="{'bg-white/10 text-primary font-bold': lang.currentLang() === 'vi'}"
                  class="px-md py-sm text-left text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center gap-sm cursor-pointer focus:outline-none w-full">
            <span>Tiếng Việt</span>
          </button>
          <button (click)="selectLanguage('ko')" 
                  [ngClass]="{'bg-white/10 text-primary font-bold': lang.currentLang() === 'ko'}"
                  class="px-md py-sm text-left text-xs text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-all flex items-center gap-sm cursor-pointer focus:outline-none w-full">
            <span>한국어</span>
          </button>
        </div>
      </div>

      <!-- Wallet Connection -->
      <button (click)="onConnectClick()" 
              [ngClass]="{
                'border-primary/20 hover:border-red-500/40 hover:bg-red-950/20 text-on-surface': connect.isConnected(),
                'bg-gradient-to-r from-primary to-secondary text-on-primary hover:shadow-[0_0_20px_rgba(176,198,255,0.4)] hover:scale-[1.02]': !connect.isConnected()
              }"
              class="border border-transparent px-lg py-sm rounded-full font-label-md transition-all active:scale-95 flex items-center gap-xs cursor-pointer group">
        <span class="material-symbols-outlined text-[16px] animate-pulse" 
              [ngClass]="{'text-green-400': connect.isConnected()}">
          {{ connect.isConnected() ? 'account_balance_wallet' : 'power' }}
        </span>
        <span *ngIf="!connect.isConnected()">{{ lang.t('CONNECT_BTN') }}</span>
        <span *ngIf="connect.isConnected()" class="group-hover:hidden transition-all">{{ connect.activeWallet() }}</span>
        <span *ngIf="connect.isConnected()" class="hidden group-hover:inline text-red-400 font-bold transition-all text-xs uppercase tracking-wider">Disconnect</span>
      </button>
    </div>

    <!-- Mobile Menu Toggle Button -->
    <button (click)="toggleMobileMenu()" class="lg:hidden text-on-surface hover:text-primary transition-colors focus:outline-none p-xs cursor-pointer">
      <span class="material-symbols-outlined text-[28px]">{{ isMobileMenuOpen ? 'close' : 'menu' }}</span>
    </button>
  </div>

  <!-- Mobile Dropdown Menu Drawer -->
  <div *ngIf="isMobileMenuOpen" 
       class="lg:hidden fixed inset-x-0 top-[72px] bottom-0 bg-[#070709]/95 backdrop-blur-2xl border-t border-white/5 flex flex-col z-40 overflow-y-auto px-margin-mobile py-lg gap-md animate-fade-in">
    
    <!-- Navigation Accordion -->
    <div class="flex flex-col gap-sm">
      <div *ngFor="let cat of categories()" class="border-b border-white/5 pb-sm">
        <button (click)="toggleCategoryMobile(cat)" 
                class="w-full text-left font-bold text-sm text-on-surface py-xs flex justify-between items-center focus:outline-none">
          <span>{{ lang.t(cat.labelKey) }}</span>
          <span class="material-symbols-outlined text-[18px] transition-transform duration-300"
                [ngClass]="{'rotate-180 text-primary': cat.isOpenMobile}">
            expand_more
          </span>
        </button>

        <!-- Accordion Links -->
        <div *ngIf="cat.isOpenMobile" class="flex flex-col gap-xs pl-md mt-xs animate-slide-down">
          <a *ngFor="let link of cat.links" 
             [routerLink]="link.route" 
             (click)="closeMobileMenu()"
             routerLinkActive="text-primary font-bold bg-white/5"
             [routerLinkActiveOptions]="{exact: true}"
             class="px-md py-sm rounded-lg text-xs text-on-surface-variant hover:text-on-surface transition-all flex items-center justify-between">
            <span>{{ lang.t(link.labelKey) }}</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Mobile Language Selector -->
    <div class="flex flex-col gap-sm border-b border-white/5 pb-sm">
      <span class="text-[10px] text-on-surface-variant uppercase tracking-widest font-semibold font-label-sm">Select Language</span>
      <div class="flex gap-sm">
        <button (click)="selectLanguage('en')" 
                [ngClass]="{'bg-primary/20 border-primary/40 text-primary': lang.currentLang() === 'en', 'bg-white/5 border-white/5 text-on-surface-variant': lang.currentLang() !== 'en'}"
                class="flex-1 py-sm rounded-lg border text-xs font-bold transition-all focus:outline-none cursor-pointer text-center">
          English
        </button>
        <button (click)="selectLanguage('vi')" 
                [ngClass]="{'bg-primary/20 border-primary/40 text-primary': lang.currentLang() === 'vi', 'bg-white/5 border-white/5 text-on-surface-variant': lang.currentLang() !== 'vi'}"
                class="flex-1 py-sm rounded-lg border text-xs font-bold transition-all focus:outline-none cursor-pointer text-center">
          Tiếng Việt
        </button>
        <button (click)="selectLanguage('ko')" 
                [ngClass]="{'bg-primary/20 border-primary/40 text-primary': lang.currentLang() === 'ko', 'bg-white/5 border-white/5 text-on-surface-variant': lang.currentLang() !== 'ko'}"
                class="flex-1 py-sm rounded-lg border text-xs font-bold transition-all focus:outline-none cursor-pointer text-center">
          한국어
        </button>
      </div>
    </div>

    <!-- Mobile Wallet Connect Button -->
    <button (click)="onConnectClick()" 
            [ngClass]="{
              'border-red-500/20 bg-red-950/10 text-red-400': connect.isConnected(),
              'bg-gradient-to-r from-primary to-secondary text-on-primary': !connect.isConnected()
            }"
            class="w-full py-md rounded-xl font-bold transition-all active:scale-98 flex items-center justify-center gap-sm mt-auto mb-10 border border-transparent">
      <span class="material-symbols-outlined text-[18px]">{{ connect.isConnected() ? 'power_off' : 'power' }}</span>
      <span>
        {{ connect.isConnected() ? 'Disconnect Wallet (' + connect.activeWallet() + ')' : lang.t('CONNECT_BTN') }}
      </span>
    </button>
  </div>
</nav>
