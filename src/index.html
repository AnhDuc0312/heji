<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heji</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body>
  <app-root>
    <style>
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: 'Inter', sans-serif;
        position: fixed;
        inset: 0;
        background-color: #050505;
        z-index: 9999;
      }
      .orb {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle, #00dbe9 0%, #b0c6ff 50%, transparent 100%);
        filter: blur(8px);
        box-shadow: 0 0 40px rgba(0, 219, 233, 0.6);
        animation: pulse 2s ease-in-out infinite alternate;
      }
      .text {
        color: #e5e2e1;
        font-size: 13px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        font-weight: 500;
        animation: fade 1.5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes fade {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
    <div class="loader-container">
      <div class="orb"></div>
      <div class="text">Initializing Access...</div>
    </div>
  </app-root>
</body>
</html>
